# ---------------------------------------------------------------------------
# gello_driver default parameters
# ---------------------------------------------------------------------------
# All values can be overridden via command-line or launch file arguments.
# ---------------------------------------------------------------------------

gello_node:
  ros__parameters:
    # Serial port ─ prefer /dev/serial/by-id/... for stability
    port: "/dev/serial/by-id/usb-FTDI_USB__-__Serial_Converter_FT763O2V-if00-port0"

    # Dynamixel bus
    baudrate: 4000000

    # Servo IDs (arm joints only, not including gripper)
    joint_ids: [0, 1, 2, 3, 4, 5, 6]

    # Per-joint offset (degrees) — USER TRIM.
    # When auto_calibrate=true (default), added ON TOP of the snap offsets
    # computed at startup.  When auto_calibrate=false, used as the sole
    # offsets.  Formula: output = (raw - snap - trim) * sign.
    #
    # To make GELLO output equal the Franka nominal home at park, set
    # trim per joint to -home_pose_rad * sign (in degrees).  For the
    # nominal Franka home
    #   [0.0056, -0.6124, 0.0124, -2.5335, 0.0131, 1.8742, 0.0426] rad
    # and joint_signs [1, -1, 1, 1, 1, 1, 1], the values are:
    #   [-0.32, -35.09, -0.71, 145.16, -0.75, -107.38, -2.44]
    joint_offsets: [180.0, 0.0, -90.0, -360.0, 0.0, -270.0, 0.0]

    # Per-joint sign correction (+1 or -1)
    joint_signs: [1, 1, 1, 1, 1, 1, 1]

    # Per-joint spring-back hold targets in OUTPUT space (degrees) —
    # same coordinate system as /gello/joint_command.
    # Any joint with `.nan` is left passive (torque off).  Finite entries
    # → that joint enters Current-based Position Control (Mode 5) and
    # springs back to that OUTPUT angle with current-limited torque
    # (limit set in the servo's EEPROM via Dynamixel Wizard).
    # Runtime: raw_target = target * sign + effective_offset,
    # so a target of 0 means "output=0" regardless of calibration.
    # Length must equal joint_ids length, or the whole list is ignored.
    joint_targets: [0.0, 0.0, .nan, .nan, .nan, .nan, .nan]

    # Auto-calibration at node startup: reads raw once, snaps each joint to
    # the nearest calibration_snap_deg° boundary → snap offset.  Effective
    # offset = snap + user_trim (joint_offsets above).  Set auto_calibrate
    # to false to force the yaml joint_offsets to be used alone.
    auto_calibrate: true
    calibration_snap_deg: 360.0

    # Published joint names (must match the robot URDF)
    joint_names:
      - fr3_joint1
      - fr3_joint2
      - fr3_joint3
      - fr3_joint4
      - fr3_joint5
      - fr3_joint6
      - fr3_joint7

    # Gripper — set gripper_id to -1 to disable
    gripper_id: 7
    gripper_open: 90.0    # degrees — fully open encoder position
    gripper_closed: 75.0  # degrees — fully closed encoder position
    # The gripper servo is set to Current-based Position Control Mode (mode 5)
    # at startup and driven to gripper_hold.  It will spring back to this angle
    # whenever the user releases the trigger.
    # Current (torque) limit is set in the servo EEPROM via Dynamixel Wizard.
    gripper_hold: 100.0    # degrees — hold / rest position

    # Smoothing (alpha=1.0 → raw, alpha→0 → very smooth/lagged)
    alpha: 0.8

    # Publishing rate (Hz)
    publish_rate: 20.0

    # Set to true to run without hardware (for testing)
    use_fake_driver: false

    home_pose:
      - 0.005642757285386324
      - -0.6124442219734192
      - 0.01244916021823883
      - -2.5334863662719727
      - 0.013070208951830864
      - 1.8741883039474487
      - 0.04261912778019905

    # ---------------------------------------------------------------------------
    # GPIO Switches (Jetson Orin Nano)
    # ---------------------------------------------------------------------------
    # Hardware assumption: each pin is pulled HIGH via an external resistor.
    #   - Switch open (not pressed) : pin = HIGH
    #   - Switch closed (pressed)   : pin = LOW
    #   - Press event               : false -> true, publishes Bool(data=true)
    #
    # gpio_enabled      : set to true to activate GPIO monitoring
    # gpio_pin_mode     : 'BOARD' = physical 40-pin header numbers
    # gpio_pins         : list of physical pin numbers, one per switch
    # gpio_bouncetime_ms: debounce/cooldown window in milliseconds
    # gpio_confirm_delay_ms: delay before confirming the line is still LOW
    # gpio_topic_names  : list of ROS 2 topic names, one per switch press
    #
    # gpio_pins and gpio_topic_names MUST have the same length.
    #
    # Jetson Orin Nano physical pin mapping:
    #   Pin  7 -> /gello/switch/record
    #   Pin 11 -> /gello/switch/success
    #   Pin 13 -> /gello/switch/failed
    # ---------------------------------------------------------------------------
    gpio_enabled: true

    gpio_pin_mode: "BOARD"
    gpio_bouncetime_ms: 250
    gpio_confirm_delay_ms: 20

    # Physical (BOARD) pin numbers for the three switches
    gpio_pins: [7, 11, 13]

    # ROS 2 topic names published only on press events (std_msgs/Bool, data=true)
    gpio_topic_names:
      - "/gello/switch/record"
      - "/gello/switch/success"
      - "/gello/switch/failed"
