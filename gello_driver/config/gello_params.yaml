# ---------------------------------------------------------------------------
# gello_driver default parameters
# ---------------------------------------------------------------------------
# All values can be overridden via command-line or launch file arguments.
# ---------------------------------------------------------------------------

gello_node:
  ros__parameters:
    # Serial port ─ prefer /dev/serial/by-id/... for stability
    port: "/dev/serial/by-id/usb-FTDI_USB__-__Serial_Converter_FT763O2V-if00-port0"

    # Dynamixel bus
    baudrate: 4000000

    # Servo IDs (arm joints only, not including gripper)
    joint_ids: [0, 1, 2, 3, 4, 5, 6]

    # Per-joint offset (radians).  Adjust so that GELLO home = robot home.
    joint_offsets:
      - 4.71238898038   # 3π/2
      - 3.14159265359   # 2π/2
      - 1.57079632679   # 1π/2
      - 6.28318530718   # 4π/2
      - 3.14159265359   # -2π/2 + 2π = π
      - 4.71238898038   # 3π/2
      - 6.28318530718   # 4π/2

    # Per-joint sign correction (+1 or -1)
    joint_signs: [1, 1, 1, 1, 1, -1, 1]

    # Published joint names (must match the robot URDF)
    joint_names:
      - fr3_joint1
      - fr3_joint2
      - fr3_joint3
      - fr3_joint4
      - fr3_joint5
      - fr3_joint6
      - fr3_joint7

    # Gripper — set gripper_id to -1 to disable
    gripper_id: 7
    gripper_open: 90    # degrees — fully open encoder position
    gripper_closed: 75  # degrees — fully closed encoder position
    # The gripper servo is set to Current-based Position Control Mode (mode 5)
    # at startup and driven to gripper_hold.  It will spring back to this angle
    # whenever the user releases the trigger.
    # Current (torque) limit is set in the servo EEPROM via Dynamixel Wizard.
    gripper_hold: 100.0    # degrees — hold / rest position

    # Smoothing (alpha=1.0 → raw, alpha→0 → very smooth/lagged)
    alpha: 0.5

    # Publishing rate (Hz)
    publish_rate: 20.0

    # Set to true to run without hardware (for testing)
    use_fake_driver: false

    # ---------------------------------------------------------------------------
    # GPIO Switches (Jetson Orin Nano)
    # ---------------------------------------------------------------------------
    # Hardware assumption: each pin is pulled HIGH via an external resistor.
    #   - Switch open (not pressed) : pin = HIGH
    #   - Switch closed (pressed)   : pin = LOW
    #   - Rising edge               : LOW → HIGH  = button release event
    #
    # gpio_enabled      : set to true to activate GPIO monitoring
    # gpio_pin_mode     : 'BOARD' = physical 40-pin header numbers (recommended)
    #                     'BCM'   = Broadcom GPIO numbers
    # gpio_bouncetime_ms: debounce window in milliseconds (default 50)
    # gpio_pins         : list of physical pin numbers, one per switch
    # gpio_topic_names  : list of ROS 2 topic names, one per switch
    #
    # gpio_pins and gpio_topic_names MUST have the same length.
    #
    # Jetson Orin Nano 40-pin header — frequently usable GPIO pins (BOARD):
    #   Pin  7 → GPIO09  /  Pin 11 → GPIO17  /  Pin 13 → GPIO27
    #   Pin 15 → GPIO22  /  Pin 29 → GPIO05  /  Pin 31 → GPIO06
    # ---------------------------------------------------------------------------
    gpio_enabled: false

    gpio_pin_mode: "BOARD"
    gpio_bouncetime_ms: 50

    # Physical (BOARD) pin numbers for the three switches
    gpio_pins: [7, 11, 13]

    # ROS 2 topic names published on rising edge (std_msgs/Bool, data=true)
    gpio_topic_names:
      - "/gello/switch/record"
      - "/gello/switch/success"
      - "/gello/switch/failed"

